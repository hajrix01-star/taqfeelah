name: Recover Owner Auth (SSH)

# Password reset runs on the VPS (uses DATABASE_URL from .env.production there).
# Do not trigger a full production deploy in the same push — use [recover-owner-auth] only.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vps-operations
  cancel-in-progress: false

jobs:
  recover:
    name: Reset owner login on VPS
    if: |
      contains(github.event.head_commit.message, '[recover-owner-auth]') ||
      contains(toJSON(github.event.commits), 'recover-owner-auth')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VPS secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Missing GitHub secret VPS_HOST"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Missing GitHub secret VPS_USER"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_PASS }}" ] && [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret VPS_PASS or VPS_SSH_PRIVATE_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Recovery summary
        run: |
          {
            echo "### Owner login recovery (SSH-only)"
            echo ""
            echo "- **Username:** \`hajri\`"
            echo "- **Password:** \`Taqfeelah2026\`"
            echo ""
            echo "Login at [taqfeelah.com/app](https://taqfeelah.com/app) or [saas-admin/login](https://taqfeelah.com/saas-admin/login)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy dependencies
        run: pip install -r scripts/requirements-deploy.txt

      - name: SSH cooldown (fail2ban recovery)
        run: |
          wait_seconds=900
          echo "Waiting ${wait_seconds}s before SSH (fail2ban / runner IP cooldown)…"
          sleep "$wait_seconds"

      - name: Reset owner auth on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_CONNECT_TIMEOUT: "30"
          VPS_CONNECT_RETRIES: "8"
          VPS_RETRY_DELAY_SECONDS: "20"
          RESET_OWNER_AUTH_QUICK: "true"
          AUTH_ORGANIZATION_ID: ${{ secrets.AUTH_ORGANIZATION_ID }}
          AUTH_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Recovery SSH attempt ${attempt}/${max_attempts}…"
            if python scripts/vps_deploy.py reset-owner-auth \
              --username "hajri" \
              --password "Taqfeelah2026"; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Owner auth recovery failed after ${max_attempts} SSH attempts."
              exit 1
            fi
            sleep_seconds=$((attempt * 180))
            echo "Waiting ${sleep_seconds}s before retry…"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Verify production login
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 30 -X POST https://taqfeelah.com/api/v1/auth/session \
            -H 'content-type: application/json' \
            -d '{"mode":"owner_password","username":"hajri","password":"Taqfeelah2026"}')"
          echo "$response"
          if ! echo "$response" | grep -q '"userId"'; then
            echo "::error::Production login verification failed after recovery."
            exit 1
          fi
          echo "Production login verification passed."
