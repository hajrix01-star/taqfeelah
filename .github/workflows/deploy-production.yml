name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight_wait_minutes:
        description: "Minutes to wait before SSH probe (use after fail2ban blocks)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "3"
          - "5"
          - "10"
          - "15"
      run_repair_scripts:
        description: "Run legacy seed/repair scripts on VPS (slow; use only when needed)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: vps-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm smoke:browser

      - name: Build
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          RELEASE_BUILD: ${{ github.sha }}
          NEXT_PUBLIC_RELEASE_BUILD: ${{ github.sha }}
          APP_MODE: production
          NEXT_PUBLIC_APP_MODE: production
          ALLOW_HEADER_AUTH_CONTEXT: "false"
          AUTH_DB_CREDENTIALS_ENABLED: "true"
          NEXT_PUBLIC_AUTH_API_ENABLED: "true"
          SAAS_ADMIN_API_ENABLED: "true"
          NEXT_PUBLIC_SAAS_ADMIN_ENABLED: "true"
          NEXT_PUBLIC_CLOSEOUTS_API_ENABLED: "true"
          NEXT_PUBLIC_ENTRIES_API_ENABLED: "true"
          NEXT_PUBLIC_REGISTER_ENTRIES_PAGINATION_ENABLED: "true"
          NEXT_PUBLIC_ORG_CONFIG_API_ENABLED: "true"
          NEXT_PUBLIC_PHASE9_API_ENABLED: "true"
          NEXT_PUBLIC_DISABLE_BROWSER_PERSISTENCE: "true"
          NEXT_PUBLIC_CLOSEOUTS_API_ORGANIZATION_ID: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_ORGANIZATION_ID }}
          NEXT_PUBLIC_CLOSEOUTS_API_OWNER_USER_ID: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_OWNER_USER_ID }}
          NEXT_PUBLIC_SUPPORT_WHATSAPP: "966533507223"
        run: pnpm build

      - name: Package production artifact
        run: node scripts/package-production-artifact.mjs

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: taqfeelah-production-artifact.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    needs: [validate]
    if: |
      !contains(github.event.head_commit.message, '[recover-owner-auth]') &&
      !contains(toJSON(github.event.commits), 'recover-owner-auth')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy dependencies
        run: pip install -r scripts/requirements-deploy.txt

      - name: Verify VPS secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Missing GitHub secret VPS_HOST"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Missing GitHub secret VPS_USER"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_PASS }}" ] && [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret VPS_PASS or VPS_SSH_PRIVATE_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add repository secrets at:"
            echo "https://github.com/hajrix01-star/taqfeelah/settings/secrets/actions"
            echo ""
            echo "Required: VPS_HOST, VPS_USER, and VPS_PASS or VPS_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Runner and site probe (diagnostic)
        run: |
          set -euo pipefail
          echo "GitHub runner egress IP: $(curl -fsS --max-time 10 https://api.ipify.org || echo unknown)"
          for url in https://taqfeelah.com https://www.taqfeelah.com; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo "000")"
            echo "$url → HTTP $code"
          done
          echo "Intermittent SSH timeout: GitHub runner IP may be blocked — re-run uses a different IP."
          echo "Set VPS_HOST to the VPS public IP (e.g. 77.37.51.67), not a hostname."

      - name: Configure deploy timing and repair flags
        env:
          DISPATCH_WAIT_MINUTES: ${{ github.event.inputs.preflight_wait_minutes || '0' }}
          DISPATCH_RUN_REPAIRS: ${{ github.event.inputs.run_repair_scripts || 'false' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            wait_seconds=$((DISPATCH_WAIT_MINUTES * 60))
            if [ "$wait_seconds" -lt 180 ]; then wait_seconds=180; fi
            echo "Re-run attempt ${RUN_ATTEMPT}: cooldown ${wait_seconds}s before SSH…"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DISPATCH_WAIT_MINUTES" != "0" ]; then
            wait_seconds=$((DISPATCH_WAIT_MINUTES * 60))
            echo "Manual deploy: cooldown ${wait_seconds}s before SSH…"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qiE 'chore\(deploy\)|deploy-retry|\[deploy-retry\]'; then
            wait_seconds=600
            echo "Deploy retry commit: cooldown ${wait_seconds}s before SSH (fail2ban recovery)…"
          else
            wait_seconds=180
            echo "Routine deploy: minimum ${wait_seconds}s preflight before SSH…"
          fi
          echo "VPS_PREFLIGHT_WAIT_SECONDS=${wait_seconds}" >> "$GITHUB_ENV"

          run_repairs="false"
          if [ "$DISPATCH_RUN_REPAIRS" = "true" ]; then
            run_repairs="true"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -q '\[run-repairs\]'; then
            run_repairs="true"
          fi
          echo "VPS_RUN_REMOTE_REPAIR_SCRIPTS=${run_repairs}" >> "$GITHUB_ENV"
          echo "Repair scripts on VPS: ${run_repairs} (opt-in via workflow input or [run-repairs] in commit message)"

      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.sha }}

      - name: Deploy to VPS (single SSH session)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_TCP_PROBE_TIMEOUT: "12"
          VPS_CONNECT_TIMEOUT: "25"
          VPS_CONNECT_RETRIES: "2"
          VPS_RETRY_DELAY_SECONDS: "15"
          VPS_PROBE_RETRIES: "5"
          VPS_PROBE_RETRY_DELAY_SECONDS: "30"
          VPS_PREFLIGHT_WAIT_SECONDS: ${{ env.VPS_PREFLIGHT_WAIT_SECONDS }}
          VPS_SSH_COMMAND_TIMEOUT: "1200"
          VPS_SKIP_REMOTE_BUILD: "true"
          VPS_RUN_REMOTE_REPAIR_SCRIPTS: ${{ env.VPS_RUN_REMOTE_REPAIR_SCRIPTS }}
          POST_DEPLOY_BASELINE_VERIFY: "false"
          RESET_FOUNDATION_ON_DEPLOY: ${{ contains(github.event.head_commit.message, '[reset-foundation]') }}
          RESET_FOUNDATION_CONFIRM: "reset-modern-foundation"
          DEPLOYMENT_WAVE: "7"
          DEPLOY_COMMIT: ${{ github.sha }}
          RELEASE_BUILD: ${{ github.sha }}
          NEXT_PUBLIC_RELEASE_BUILD: ${{ github.sha }}
          APP_MODE: "production"
          NEXT_PUBLIC_APP_MODE: "production"
          ALLOW_HEADER_AUTH_CONTEXT: "false"
          AUTH_DB_CREDENTIALS_ENABLED: "true"
          NEXT_PUBLIC_AUTH_API_ENABLED: "true"
          SAAS_ADMIN_API_ENABLED: "true"
          NEXT_PUBLIC_SAAS_ADMIN_ENABLED: "true"
          SAAS_PLATFORM_ADMIN_USER_IDS: ${{ secrets.SAAS_PLATFORM_ADMIN_USER_IDS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          AUTH_ORGANIZATION_ID: ${{ secrets.AUTH_ORGANIZATION_ID }}
          AUTH_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
          AUTH_VERIFY_OWNER_USERNAME: ${{ secrets.AUTH_VERIFY_OWNER_USERNAME }}
          AUTH_VERIFY_OWNER_PASSWORD: ${{ secrets.AUTH_VERIFY_OWNER_PASSWORD }}
          NEXT_PUBLIC_CLOSEOUTS_API_ENABLED: "true"
          NEXT_PUBLIC_ENTRIES_API_ENABLED: "true"
          NEXT_PUBLIC_REGISTER_ENTRIES_PAGINATION_ENABLED: "true"
          NEXT_PUBLIC_ORG_CONFIG_API_ENABLED: "true"
          NEXT_PUBLIC_PHASE9_API_ENABLED: "true"
          NEXT_PUBLIC_DISABLE_BROWSER_PERSISTENCE: "true"
          NEXT_PUBLIC_CLOSEOUTS_API_ORGANIZATION_ID: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_ORGANIZATION_ID }}
          NEXT_PUBLIC_CLOSEOUTS_API_OWNER_USER_ID: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_OWNER_USER_ID }}
          NEXT_PUBLIC_SUPPORT_WHATSAPP: "966533507223"
          APP_PUBLIC_ORIGIN: "https://taqfeelah.com"
          AUTH_PASSWORD_RESET_ENABLED: "true"
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -euo pipefail
          workflow_attempt=1
          max_workflow_attempts=3
          while [ "$workflow_attempt" -le "$max_workflow_attempts" ]; do
            echo "Full deploy attempt ${workflow_attempt}/${max_workflow_attempts} (one SSH session per try)"
            if python scripts/vps_deploy.py deploy-production \
              --domain taqfeelah.com \
              --www-domain www.taqfeelah.com \
              --local-path . \
              --artifact-path taqfeelah-production-artifact.tar.gz; then
              exit 0
            fi
            if [ "$workflow_attempt" -eq "$max_workflow_attempts" ]; then
              echo "::error::Deploy failed after ${max_workflow_attempts} full attempts"
              exit 1
            fi
            sleep_seconds=$((workflow_attempt * 120))
            echo "Waiting ${sleep_seconds}s before retry (allow fail2ban cooldown / new runner IP)…"
            sleep "$sleep_seconds"
            workflow_attempt=$((workflow_attempt + 1))
          done
