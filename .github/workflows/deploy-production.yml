name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VPS secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Missing GitHub secret VPS_HOST"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Missing GitHub secret VPS_USER"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_PASS }}" ]; then
            echo "::error::Missing GitHub secret VPS_PASS"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add repository secrets at:"
            echo "https://github.com/hajrix01-star/taqfeelah/settings/secrets/actions"
            echo ""
            echo "Required: VPS_HOST, VPS_USER, VPS_PASS"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy dependencies
        run: pip install -r scripts/requirements-deploy.txt

      - name: Deploy Taqfeelah (PM2 + Nginx + SSL)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_CONNECT_TIMEOUT: "20"
          VPS_CONNECT_RETRIES: "5"
          VPS_RETRY_DELAY_SECONDS: "8"
          APP_MODE: ${{ secrets.APP_MODE }}
          NEXT_PUBLIC_APP_MODE: ${{ secrets.NEXT_PUBLIC_APP_MODE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          AUTH_ORGANIZATION_ID: ${{ secrets.AUTH_ORGANIZATION_ID }}
          AUTH_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
          AUTH_OWNER_USERNAME: ${{ secrets.AUTH_OWNER_USERNAME }}
          AUTH_OWNER_PASSWORD: ${{ secrets.AUTH_OWNER_PASSWORD }}
          AUTH_EMPLOYEE_PIN_MAP: ${{ secrets.AUTH_EMPLOYEE_PIN_MAP }}
          NEXT_PUBLIC_CLOSEOUTS_API_ENABLED: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_ENABLED }}
          NEXT_PUBLIC_ENTRIES_API_ENABLED: ${{ secrets.NEXT_PUBLIC_ENTRIES_API_ENABLED }}
          NEXT_PUBLIC_CLOSEOUTS_API_ORGANIZATION_ID: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_ORGANIZATION_ID }}
          NEXT_PUBLIC_CLOSEOUTS_API_OWNER_USER_ID: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_OWNER_USER_ID }}
          NEXT_PUBLIC_CLOSEOUTS_STORE_ID_MAP: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_STORE_ID_MAP }}
          NEXT_PUBLIC_CLOSEOUTS_USER_ID_MAP: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_USER_ID_MAP }}
          NEXT_PUBLIC_CLOSEOUTS_SALES_CHANNEL_ID_MAP: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_SALES_CHANNEL_ID_MAP }}
        run: |
          python scripts/vps_deploy.py deploy-pm2 \
            --domain taqfeelah.com \
            --www-domain www.taqfeelah.com \
            --local-path .

      - name: Verify production and sibling sites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_CONNECT_TIMEOUT: "20"
          VPS_CONNECT_RETRIES: "5"
          VPS_RETRY_DELAY_SECONDS: "8"
        run: |
          python scripts/vps_deploy.py verify \
            --domain taqfeelah.com \
            --www-domain www.taqfeelah.com
