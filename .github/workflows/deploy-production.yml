name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight_wait_minutes:
        description: "Minutes to wait before SSH probe (use after fail2ban blocks)"
        required: false
        default: "10"
        type: choice
        options:
          - "0"
          - "3"
          - "5"
          - "10"
          - "15"

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm smoke:browser

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to VPS
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy dependencies
        run: pip install -r scripts/requirements-deploy.txt

      - name: Verify VPS secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Missing GitHub secret VPS_HOST"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Missing GitHub secret VPS_USER"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_PASS }}" ] && [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret VPS_PASS or VPS_SSH_PRIVATE_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add repository secrets at:"
            echo "https://github.com/hajrix01-star/taqfeelah/settings/secrets/actions"
            echo ""
            echo "Required: VPS_HOST, VPS_USER, and VPS_PASS or VPS_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Public site probe (diagnostic)
        run: |
          set -euo pipefail
          for url in https://taqfeelah.com https://www.taqfeelah.com; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo "000")"
            echo "$url → HTTP $code"
          done
          echo "If HTTPS is 200 but SSH preflight fails, fail2ban/firewall is blocking GitHub runners."
          echo "On VPS (root): bash scripts/vps-unban-ci-ssh.sh"

      - name: Wait before SSH probe (fail2ban cooldown)
        env:
          DISPATCH_WAIT_MINUTES: ${{ github.event.inputs.preflight_wait_minutes || '10' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          min_wait=0
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            min_wait=600
            wait_seconds=$((DISPATCH_WAIT_MINUTES * 60))
            if [ "$wait_seconds" -lt "$min_wait" ]; then
              wait_seconds="$min_wait"
            fi
            echo "Re-run attempt ${RUN_ATTEMPT}: waiting ${wait_seconds}s for SSH ban cooldown…"
            sleep "$wait_seconds"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DISPATCH_WAIT_MINUTES" != "0" ]; then
            wait_seconds=$((DISPATCH_WAIT_MINUTES * 60))
            echo "Manual deploy: waiting ${wait_seconds}s before SSH probe…"
            sleep "$wait_seconds"
          else
            echo "Push deploy: waiting 90s so prior SSH sessions can finish and fail2ban can cool down…"
            sleep 90
          fi

      - name: Preflight VPS connectivity (same runner as deploy)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_TCP_PROBE_TIMEOUT: "10"
          VPS_CONNECT_TIMEOUT: "20"
          VPS_CONNECT_RETRIES: "2"
          VPS_RETRY_DELAY_SECONDS: "12"
          VPS_PROBE_RETRIES: "2"
          VPS_PROBE_RETRY_DELAY_SECONDS: "15"
        run: |
          python scripts/vps_deploy.py preflight \
            --domain taqfeelah.com \
            --www-domain www.taqfeelah.com

      - name: Deploy Taqfeelah (PM2 + Nginx + SSL)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_CONNECT_TIMEOUT: "20"
          VPS_CONNECT_RETRIES: "3"
          VPS_RETRY_DELAY_SECONDS: "12"
          RESET_FOUNDATION_ON_DEPLOY: ${{ contains(github.event.head_commit.message, '[reset-foundation]') }}
          RESET_FOUNDATION_CONFIRM: "reset-modern-foundation"
          DEPLOYMENT_WAVE: "5"
          APP_MODE: "production"
          NEXT_PUBLIC_APP_MODE: "production"
          NEXT_PUBLIC_PROTOTYPE_ACCESS_MODE: "true"
          ALLOW_HEADER_AUTH_CONTEXT: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          AUTH_ORGANIZATION_ID: ${{ secrets.AUTH_ORGANIZATION_ID }}
          AUTH_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
          AUTH_OWNER_USERNAME: ${{ secrets.AUTH_OWNER_USERNAME }}
          AUTH_OWNER_PASSWORD: ${{ secrets.AUTH_OWNER_PASSWORD }}
          AUTH_EMPLOYEE_PIN_MAP: ${{ secrets.AUTH_EMPLOYEE_PIN_MAP }}
          NEXT_PUBLIC_CLOSEOUTS_API_ENABLED: "true"
          NEXT_PUBLIC_ENTRIES_API_ENABLED: "true"
          NEXT_PUBLIC_REGISTER_ENTRIES_PAGINATION_ENABLED: "true"
          NEXT_PUBLIC_ORG_CONFIG_API_ENABLED: "true"
          NEXT_PUBLIC_PHASE9_API_ENABLED: "true"
          NEXT_PUBLIC_DISABLE_BROWSER_PERSISTENCE: "true"
          NEXT_PUBLIC_CLOSEOUTS_API_ORGANIZATION_ID: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_ORGANIZATION_ID }}
          NEXT_PUBLIC_CLOSEOUTS_API_OWNER_USER_ID: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_API_OWNER_USER_ID }}
          NEXT_PUBLIC_CLOSEOUTS_STORE_ID_MAP: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_STORE_ID_MAP }}
          NEXT_PUBLIC_CLOSEOUTS_USER_ID_MAP: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_USER_ID_MAP }}
          NEXT_PUBLIC_CLOSEOUTS_SALES_CHANNEL_ID_MAP: ${{ secrets.NEXT_PUBLIC_CLOSEOUTS_SALES_CHANNEL_ID_MAP }}
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=4
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Deploy attempt ${attempt}/${max_attempts}"
            if python scripts/vps_deploy.py deploy-pm2 \
              --domain taqfeelah.com \
              --www-domain www.taqfeelah.com \
              --local-path .; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Deploy failed after ${max_attempts} SSH attempts"
              exit 1
            fi
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done

      - name: Verify production and sibling sites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_CONNECT_TIMEOUT: "20"
          VPS_CONNECT_RETRIES: "3"
          VPS_RETRY_DELAY_SECONDS: "12"
          POST_DEPLOY_BASELINE_VERIFY: "true"
          DEPLOYMENT_WAVE: "5"
        run: |
          set -euo pipefail
          sleep 30
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Verify attempt ${attempt}/${max_attempts}"
            if python scripts/vps_deploy.py verify \
              --domain taqfeelah.com \
              --www-domain www.taqfeelah.com; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Post-deploy verify failed after ${max_attempts} SSH attempts"
              exit 1
            fi
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done
