name: Recover Owner Auth

# Manual-only: push-triggered recovery runs inside deploy-production.yml
# (single SSH session). Parallel recover + deploy jobs cause fail2ban blocks.
on:
  workflow_dispatch:
    inputs:
      owner_username:
        description: Owner username to set
        required: true
      owner_password:
        description: Owner password to set (min 8 chars)
        required: true

permissions:
  contents: read

concurrency:
  group: recover-owner-auth
  cancel-in-progress: false

jobs:
  recover:
    name: Reset owner auth on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VPS secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Missing GitHub secret VPS_HOST"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Missing GitHub secret VPS_USER"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_PASS }}" ] && [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret VPS_PASS or VPS_SSH_PRIVATE_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy dependencies
        run: pip install -r scripts/requirements-deploy.txt

      - name: SSH preflight cooldown
        run: |
          echo "Waiting 600s before SSH (fail2ban / runner IP cooldown)…"
          sleep 600

      - name: Reset owner auth on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_CONNECT_TIMEOUT: "25"
          VPS_CONNECT_RETRIES: "5"
          VPS_RETRY_DELAY_SECONDS: "15"
          AUTH_ORGANIZATION_ID: ${{ secrets.AUTH_ORGANIZATION_ID }}
          AUTH_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
        run: |
          python scripts/vps_deploy.py reset-owner-auth \
            --username "${{ github.event.inputs.owner_username }}" \
            --password "${{ github.event.inputs.owner_password }}"
