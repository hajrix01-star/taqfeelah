name: Recover Owner Auth

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      owner_username:
        description: Owner username to set
        required: true
      owner_password:
        description: Owner password to set (min 8 chars)
        required: true

permissions:
  contents: read

concurrency:
  group: recover-owner-auth
  cancel-in-progress: false

jobs:
  recover:
    name: Reset owner auth on VPS
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[recover-owner-auth]') ||
      contains(toJSON(github.event.commits), 'recover-owner-auth')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VPS secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Missing GitHub secret VPS_HOST"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Missing GitHub secret VPS_USER"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_PASS }}" ] && [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret VPS_PASS or VPS_SSH_PRIVATE_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Resolve recovery credentials
        id: creds
        env:
          DISPATCH_USERNAME: ${{ github.event.inputs.owner_username }}
          DISPATCH_PASSWORD: ${{ github.event.inputs.owner_password }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            username="${DISPATCH_USERNAME}"
            password="${DISPATCH_PASSWORD}"
          else
            username="hajri"
            password="Taqfeelah2026"
          fi
          if [ -z "$username" ] || [ -z "$password" ]; then
            echo "::error::Owner username and password are required."
            exit 1
          fi
          if [ "${#password}" -lt 8 ]; then
            echo "::error::Owner password must be at least 8 characters."
            exit 1
          fi
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          {
            echo "### Owner login recovery"
            echo ""
            echo "- **Username:** \`$username\`"
            echo "- **Password:** \`$password\`"
            echo ""
            echo "Use at [taqfeelah.com/app](https://taqfeelah.com/app) or [saas-admin/login](https://taqfeelah.com/saas-admin/login)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy dependencies
        run: pip install -r scripts/requirements-deploy.txt

      - name: SSH preflight cooldown
        run: |
          echo "Waiting 180s before SSH (fail2ban / runner IP cooldown)…"
          sleep 180

      - name: Reset owner auth on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_CONNECT_TIMEOUT: "25"
          VPS_CONNECT_RETRIES: "5"
          VPS_RETRY_DELAY_SECONDS: "15"
          VPS_PROBE_RETRIES: "5"
          VPS_PROBE_RETRY_DELAY_SECONDS: "30"
          AUTH_ORGANIZATION_ID: ${{ secrets.AUTH_ORGANIZATION_ID }}
          AUTH_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
        run: |
          python scripts/vps_deploy.py reset-owner-auth \
            --username "${{ steps.creds.outputs.username }}" \
            --password "${{ steps.creds.outputs.password }}"
