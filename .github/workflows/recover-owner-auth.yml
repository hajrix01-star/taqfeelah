name: Recover Owner Auth

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      owner_username:
        description: Owner username to set
        required: true
      owner_password:
        description: Owner password to set (min 8 chars)
        required: true

permissions:
  contents: read

concurrency:
  group: recover-owner-auth
  cancel-in-progress: false

jobs:
  recover:
    name: Reset owner auth
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[recover-owner-auth]') ||
      contains(toJSON(github.event.commits), 'recover-owner-auth')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve recovery credentials
        id: creds
        env:
          DISPATCH_USERNAME: ${{ github.event.inputs.owner_username }}
          DISPATCH_PASSWORD: ${{ github.event.inputs.owner_password }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            username="${DISPATCH_USERNAME}"
            password="${DISPATCH_PASSWORD}"
          else
            username="hajri"
            password="Taqfeelah2026"
          fi
          if [ -z "$username" ] || [ -z "$password" ]; then
            echo "::error::Owner username and password are required."
            exit 1
          fi
          if [ "${#password}" -lt 8 ]; then
            echo "::error::Owner password must be at least 8 characters."
            exit 1
          fi
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          {
            echo "### Owner login recovery"
            echo ""
            echo "- **Username:** \`$username\`"
            echo "- **Password:** \`$password\`"
            echo ""
            echo "Use at [taqfeelah.com/app](https://taqfeelah.com/app) or [saas-admin/login](https://taqfeelah.com/saas-admin/login)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::Missing GitHub secret DATABASE_URL"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed owner credentials in PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_OWNER_USERNAME: ${{ steps.creds.outputs.username }}
          AUTH_OWNER_PASSWORD: ${{ steps.creds.outputs.password }}
          AUTH_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
          SEED_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
        run: node scripts/seed-auth-credentials.mjs

      - name: Verify owner login against production API
        env:
          USERNAME: ${{ steps.creds.outputs.username }}
          PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 30 -X POST https://taqfeelah.com/api/v1/auth/session \
            -H 'content-type: application/json' \
            -d "{\"mode\":\"owner_password\",\"username\":\"${USERNAME}\",\"password\":\"${PASSWORD}\"}")"
          echo "$response"
          if ! echo "$response" | grep -q '"userId"'; then
            echo "::error::Production login verification failed."
            exit 1
          fi
          echo "Production login verification passed."
