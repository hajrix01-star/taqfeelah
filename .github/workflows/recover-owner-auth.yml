name: Recover Owner Auth

on:
  workflow_dispatch:
    inputs:
      owner_username:
        description: Owner username to set
        required: true
        default: hajri
      owner_password:
        description: Owner password to set
        required: true
        default: "123"

permissions:
  contents: read

jobs:
  recover:
    name: Reset owner auth on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VPS secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Missing GitHub secret VPS_HOST"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Missing GitHub secret VPS_USER"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_PASS }}" ]; then
            echo "::error::Missing GitHub secret VPS_PASS"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy dependencies
        run: pip install -r scripts/requirements-deploy.txt

      - name: Reset owner auth on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_CONNECT_TIMEOUT: "20"
          VPS_CONNECT_RETRIES: "5"
          VPS_RETRY_DELAY_SECONDS: "8"
          AUTH_ORGANIZATION_ID: ${{ secrets.AUTH_ORGANIZATION_ID }}
          AUTH_OWNER_USER_ID: ${{ secrets.AUTH_OWNER_USER_ID }}
          AUTH_OWNER_USERNAME: ${{ github.event.inputs.owner_username }}
          AUTH_OWNER_PASSWORD: ${{ github.event.inputs.owner_password }}
        run: |
          python scripts/vps_deploy.py reset-owner-auth \
            --username "${{ github.event.inputs.owner_username }}" \
            --password "${{ github.event.inputs.owner_password }}"
